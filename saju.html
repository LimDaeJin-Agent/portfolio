<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>간단 사주 프로그램</title>
</head>
<body>
  <h1>간단 사주 보기</h1>

  <form id="saju-form">
    <label>이름 <input type="text" name="name"></label><br>
    <label>생년월일 <input type="date" name="birthDate" required></label><br>
    <label>태어난 시간 <input type="time" name="birthTime"></label><br>
    <label>성별
      <select name="gender">
        <option value="남">남</option>
        <option value="여">여</option>
      </select>
    </label><br>
    <button type="submit">사주보기</button>
  </form>

  <h2>결과</h2>
  <pre id="result"></pre>

  <script>
    const form = document.getElementById('saju-form');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));

      result.textContent = '분석 중...';

      // TODO: 서버(/api/saju)로 생년월일/시간/성별 전달, 결과 텍스트 표시
      const res = await fetch('/api/saju', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const json = await res.json();
      result.textContent = json.result;
    });
  </script>
</body>
</html>
