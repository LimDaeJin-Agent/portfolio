<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>대입 합격률/취업 예측 (참고용)</title>
</head>
<body>
  <p style="color:red;font-weight:bold;">
    ⚠️ 아래 결과는 AI의 추정치이며 실제 입시 결과·취업 통계와 다를 수 있습니다. 참고용으로만 활용하세요.
  </p>

  <h1>학생부/수능 성적 기반 대학·학과 추천</h1>

  <form id="predict-form">
    <fieldset>
      <legend>학생부</legend>
      <label>내신 평균 등급 (1~9) <input type="number" step="0.1" min="1" max="9" name="naesinAvg" required></label><br>
      <label>세부활동(세특/동아리/수상 등)<br>
        <textarea name="activities" rows="4" cols="50"></textarea>
      </label>
    </fieldset>

    <fieldset>
      <legend>수능 성적</legend>
      <label>국어 표준점수 <input type="number" name="korScore" required></label><br>
      <label>수학 표준점수 <input type="number" name="mathScore" required></label>
      <label>수학 선택과목
        <select name="mathType">
          <option value="확률과통계">확률과통계</option>
          <option value="미적분">미적분</option>
          <option value="기하">기하</option>
        </select>
      </label><br>
      <label>영어 등급 (1~9) <input type="number" min="1" max="9" name="engGrade" required></label><br>
      <label>탐구1 과목명 <input type="text" name="elective1Name"></label>
      <label>탐구1 표준점수 <input type="number" name="elective1Score"></label><br>
      <label>탐구2 과목명 <input type="text" name="elective2Name"></label>
      <label>탐구2 표준점수 <input type="number" name="elective2Score"></label><br>
      <label>한국사 등급 (1~9) <input type="number" min="1" max="9" name="historyGrade" required></label>
    </fieldset>

    <fieldset>
      <legend>희망 계열 (선택)</legend>
      <input type="text" name="interestField" placeholder="예: 컴퓨터공학, 경영학 (비워두면 폭넓게 추천)">
    </fieldset>

    <button type="submit">예측하기</button>
  </form>

  <h2>결과</h2>
  <div id="result"></div>

  <script>
    const form = document.getElementById('predict-form');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      result.textContent = '분석 중... (최대 1분 정도 걸릴 수 있습니다)';

      try {
        const res = await fetch('/api/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const json = await res.json();

        if (json.error) {
          result.textContent = '오류: ' + json.error;
          return;
        }

        renderResult(json);
      } catch (err) {
        result.textContent = '요청 중 오류가 발생했습니다: ' + err;
      }
    });

    function renderResult(json) {
      result.innerHTML = '';

      const disclaimer = document.createElement('p');
      disclaimer.style.color = 'red';
      disclaimer.textContent = json.disclaimer || '';
      result.appendChild(disclaimer);

      const tierOrder = ['상향', '적정', '안정'];
      tierOrder.forEach((tier) => {
        const items = (json.recommendations || []).filter((r) => r.tier === tier);
        if (items.length === 0) return;

        const section = document.createElement('section');
        const h3 = document.createElement('h3');
        h3.textContent = tier;
        section.appendChild(h3);

        items.forEach((item) => {
          const card = document.createElement('div');
          card.style.border = '1px solid #ccc';
          card.style.padding = '8px';
          card.style.marginBottom = '8px';
          if (item.confidence === 'low') card.style.opacity = '0.6';

          card.innerHTML = `
            <strong>${item.university} - ${item.department}</strong>
            (신뢰도: ${item.confidence || '-'})<br>
            예상 합격률: ${item.admission_probability_range || '-'}<br>
            근거: ${item.reasoning || '-'}<br>
          `;

          const table = document.createElement('table');
          table.border = '1';
          table.innerHTML = `
            <tr><th>학점 구간</th><th>취업률(추정)</th><th>예상 연봉(추정)</th></tr>
            ${(item.employment_by_gpa || [])
              .map(
                (row) =>
                  `<tr><td>${row.gpa_range}</td><td>${row.employment_rate_range}</td><td>${row.expected_salary_range}</td></tr>`
              )
              .join('')}
          `;
          card.appendChild(table);
          section.appendChild(card);
        });

        result.appendChild(section);
      });
    }
  </script>
</body>
</html>
